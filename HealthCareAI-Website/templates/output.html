{% extends "base.html" %}

{% block title %}Medical Report - HealthCare AI{% endblock %}

{% block content %}
<section class="w-full py-20 bg-background min-h-[calc(100vh-80px)] flex flex-col justify-center relative overflow-hidden">
    <!-- Ambient glow for emphasis -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[40rem] h-[40rem] bg-accent opacity-5 filter blur-[150px] rounded-full pointer-events-none -z-10"></div>
    
    <div class="mx-auto max-w-4xl w-full px-6 relative z-10">
        
        <div class="mb-12 text-center">
            <div class="mb-4 flex items-center justify-center gap-4">
                <span class="h-px w-12 bg-border"></span>
                <span class="font-mono text-xs font-medium uppercase tracking-[0.15em] text-accent">Diagnostic Outcome</span>
                <span class="h-px w-12 bg-border"></span>
            </div>
            <h1 class="font-serif text-5xl tracking-tight">{{ disease }} Report</h1>
        </div>
        
        <div class="bg-card border border-border rounded-xl shadow-lg shadow-black/5 overflow-hidden flex flex-col md:flex-row">
            <!-- Left side visual -->
            <div class="w-full md:w-2/5 h-48 md:h-auto relative bg-muted/30">
                <img src="{{ url_for('static', filename='Images/bg-3.jpg') }}" alt="Medical Analysis" class="w-full h-full object-cover filter grayscale-[20%] brightness-95">
                <div class="absolute inset-0 bg-gradient-to-r from-transparent to-card/90 md:to-card"></div>
                <div class="absolute inset-0 bg-accent/5 mix-blend-multiply"></div>
            </div>
            
            <!-- Right side details -->
            <div class="w-full md:w-3/5 p-10 md:p-14 relative flex flex-col justify-center bg-card">
                <div class="absolute top-0 right-0 w-24 h-24 border-t border-r border-border rounded-tr-xl"></div>
                
                <h3 class="font-serif text-2xl mb-8 flex items-center gap-3">
                    <span class="w-2 h-2 rounded-full bg-accent"></span>
                    Patient Profile
                </h3>
                
                <div class="space-y-6">
                    <div class="grid grid-cols-[120px_1fr] items-baseline border-b border-border pb-4">
                        <span class="small-caps text-muted-foreground">Patient ID</span>
                        <span class="font-mono text-foreground font-medium">{{ id_ }}</span>
                    </div>
                    
                    <div class="grid grid-cols-[120px_1fr] items-baseline border-b border-border pb-4">
                        <span class="small-caps text-muted-foreground">Name</span>
                        <span class="font-sans text-foreground text-lg">{{ name }}</span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-6 border-b border-border pb-4">
                        <div class="grid grid-cols-[120px_1fr] items-baseline">
                            <span class="small-caps text-muted-foreground">Age</span>
                            <span class="font-mono text-foreground">{{ age }}</span>
                        </div>
                        <div class="grid grid-cols-[80px_1fr] items-baseline">
                            <span class="small-caps text-muted-foreground">Gender</span>
                            <span class="font-sans text-foreground">{{ gender }}</span>
                        </div>
                    </div>
                    
                    <div class="pt-6">
                        <span class="small-caps text-accent block mb-3">Diagnostic Result</span>
                        <div class="p-5 bg-muted/40 border-l-2 border-accent rounded-r-md">
                            <p class="font-serif text-xl leading-relaxed text-foreground">{{ result }}</p>
                        </div>
                    </div>
                </div>
                
                <div class="mt-12 flex items-center justify-between">
                    <a href="{{ url_for('home') }}" class="small-caps text-muted-foreground hover:text-foreground group flex items-center gap-2 transition-colors">
                        <span class="group-hover:-translate-x-1 transition-transform">←</span> Return Home
                    </a>
                    <button onclick="window.print()" class="inline-flex min-h-[44px] items-center justify-center rounded-md border border-border bg-background px-6 py-2 text-sm font-medium text-foreground hover:bg-muted hover:border-accent hover:text-accent transition-all shadow-sm">
                        Print Report
                    </button>
                </div>
                
            </div>
        </div>
        
    </div>
</section>
{% endblock %}
